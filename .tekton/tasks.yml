
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: cleanup-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        if [ -n "${WORKSPACE_SOURCE_PATH:-}" ] && [ -d "$WORKSPACE_SOURCE_PATH" ]; then
          find "$WORKSPACE_SOURCE_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          echo "Workspace source files cleaned."
        else
          echo "WORKSPACE_SOURCE_PATH is missing or is not a directory."
          exit 1
        fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-jest-tests
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npx jest --runInBand
